<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Button Showcase</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

    <div class="flex flex-wrap justify-center gap-4 p-8 max-w-7xl">
	<div class="flex flex-wrap justify-center gap-4 p-8">

    <!-- Hero Button -->
    <button class="bg-white text-indigo-700 font-bold px-8 py-3 rounded-full shadow-lg hover:bg-indigo-50 transition text-lg">
        Try the Class Activity ↓
    </button>

    <!-- Buttons Section -->
    <button class="bg-indigo-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-indigo-700 transition">
        Primary
    </button>

    <button class="bg-white text-indigo-600 border-2 border-indigo-600 px-6 py-3 rounded-lg font-semibold hover:bg-indigo-50 transition">
        Outline
    </button>

    <button class="bg-green-500 text-white px-6 py-3 rounded-full font-semibold hover:bg-green-600 transition shadow-md">
        Pill
    </button>

    <button class="bg-red-500 text-white px-6 py-3 rounded-lg font-semibold hover:scale-105 transition transform">
        Scale Hover
    </button>

    <button class="bg-gray-200 text-gray-500 px-6 py-3 rounded-lg font-semibold cursor-not-allowed" disabled>
        Disabled
    </button>

    <button class="bg-gradient-to-r from-pink-500 to-purple-500 text-white px-6 py-3 rounded-full font-semibold shadow-lg hover:opacity-90 transition">
        Gradient
    </button>

    <!-- Form Submit Button -->
    <button class="bg-indigo-600 text-white font-bold py-3 px-6 rounded-lg hover:bg-indigo-700 transition text-sm">
        Submit ✓
    </button>

    <!-- Profile Card Button -->
    <button class="bg-white text-blue-600 px-4 py-2 rounded hover:bg-blue-50 transition font-medium border">
        View Profile
    </button>

</div>
    </div>

</body>
</html>
