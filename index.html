
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tailwind CSS Interactive Cyberpunk Presentation</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000;color:#cfefff;font-family:'Share Tech Mono',monospace}
.app{min-height:100vh;background:radial-gradient(circle at top,#07152d,#000);}
.header{text-align:center;padding:20px;border-bottom:2px solid #00ffff}
h1{font-family:Orbitron,sans-serif;color:#00ffff;text-shadow:0 0 10px #00ffff}
.main{display:flex;min-height:calc(100vh - 90px)}
.left{width:42%;padding:12px;border-right:1px solid #00ffff44}
.right{flex:1;padding:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{background:#07111d;border:1px solid #00ffff55;padding:12px;border-radius:8px;cursor:pointer;
transition:.25s}
.card:hover{transform:translateY(-3px);box-shadow:0 0 12px #00ffff66}
.title{font-family:Orbitron,sans-serif;color:#00ffff;font-size:14px}
.icon{font-size:22px}
.viewer{background:#06101b;border:1px solid #00ffff44;border-radius:8px;padding:16px;min-height:240px}
svg{width:100%;height:180px;background:#03101b;border:1px solid #113}
.quick button{margin:4px;background:#02151f;color:#00ffff;border:1px solid #00ffff55;padding:6px 10px}

.parambox{margin-top:12px;background:#03131d;border:1px solid #00ffff55;border-radius:8px;padding:12px}
.parambox h3{margin:0 0 8px;color:#00ffff;font-family:Orbitron,sans-serif;font-size:13px}
.parambox table{width:100%;border-collapse:collapse;font-size:13px}
.parambox td{border-bottom:1px solid #114;padding:6px;color:#bfefff}
</style>
</head>
<body>
<div class="app">
<div class="header">
<h1>TAILWIND CSS INTERACTIVE TERMINAL</h1>
<div>Click concepts and explore Tailwind basics</div>
</div>

<div class="main">
<div class="left">
<div class="grid" id="cards"></div>

<div class="quick">
<button onclick="show('intro')">What is Tailwind?</button>
<button onclick="show('flex')">Flexbox</button>
<button onclick="show('grid')">Grid</button>
<button onclick="show('responsive')">Responsive</button>

<br><br>

<!-- Live Demo Button -->
<a href="Live_Demo.html" style="text-decoration:none; display:block;">
<button
style="
width:100%;
background:#00ffff;
color:#02151f;
border:1px solid #00ffff55;
padding:10px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
"
onmouseover="this.style.boxShadow='0 0 12px #00ffff';"
onmouseout="this.style.boxShadow='none';"
>
🚀 Open Live Demo
</button>
</a>
</div>
</div>

<div class="right">
<div class="viewer">
<h2 id="heading" class="title">Welcome</h2>
<p id="body">Select any concept.</p>
<svg id="svg" viewBox="0 0 500 180"></svg>
<div class="parambox">
<h3>Key Parameters</h3>
<table id="ptable"></table>
</div>
</div>
</div>
</div>
</div>

<script>
const data={
intro:{params:[['Framework','Utility First'],['Release','Modern CSS'],['Use','Rapid UI'],['Responsive','Built-in']],i:"⚡",t:"What is Tailwind CSS?",
b:"Utility-first CSS framework. Build UI using classes like bg-blue-500 p-4 rounded instead of writing custom CSS.",
draw(){
return `<rect x="170" y="20" width="160" height="40" fill="none" stroke="#00ffff"/>
<text x="250" y="45" fill="#00ffff" text-anchor="middle">Tailwind</text>
<line x1="250" y1="60" x2="250" y2="90" stroke="#00ffff"/>
<text x="80" y="130" fill="#00ff88">Colors</text>
<text x="200" y="130" fill="#ffaa00">Spacing</text>
<text x="330" y="130" fill="#ff44cc">Flex</text>
<text x="430" y="130" fill="#4488ff">Grid</text>
<line x1="250" y1="90" x2="80" y2="115" stroke="#00ffff"/>
<line x1="250" y1="90" x2="200" y2="115" stroke="#00ffff"/>
<line x1="250" y1="90" x2="330" y2="115" stroke="#00ffff"/>
<line x1="250" y1="90" x2="430" y2="115" stroke="#00ffff"/>`;}},
install:{params:[['Method','CDN/NPM'],['Command','npm install'],['Config','tailwind.config'],['Output','Optimized CSS']],i:"⬇",t:"Installation",b:"Use CDN or npm install tailwindcss and configure content scanning.",draw(){return `<text x="60" y="40" fill="#cc66ff">CDN</text><text x="60" y="80" fill="#cc66ff">&lt;script src=tailwindcss&gt;</text><text x="300" y="40" fill="#00ffff">NPM</text><text x="300" y="80" fill="#00ffff">npm install tailwindcss</text>`}},
utility:{params:[['Example','p-4'],['Text','text-center'],['Color','bg-blue-500'],['Radius','rounded']],i:"◈",t:"Utility Classes",b:"Combine small classes: text-center font-bold p-4 bg-blue-500 rounded-lg",draw(){return `<text x="40" y="90" fill="#00ff88">HTML + Utilities → Styled UI</text>`}},
colors:{params:[['bg-*','Background'],['text-*','Text'],['border-*','Border'],['dark:*','Dark Mode']],i:"🎨",t:"Colors",b:"bg-red-500 text-blue-700 dark:bg-gray-900",draw(){return `<rect x="50" y="50" width="70" height="70" fill="#ef4444"/><rect x="150" y="50" width="70" height="70" fill="#3b82f6"/><rect x="250" y="50" width="70" height="70" fill="#22c55e"/><rect x="350" y="50" width="70" height="70" fill="#6b7280"/>`}},
spacing:{params:[['p-*','Padding'],['m-*','Margin'],['px-*','Horizontal'],['py-*','Vertical']],i:"⬚",t:"Spacing",b:"p-4 m-2 px-6 py-8 create consistent spacing.",draw(){return `<rect x="150" y="40" width="200" height="100" fill="none" stroke="#ffaa00"/><rect x="190" y="70" width="120" height="40" fill="none" stroke="#00ffff"/><text x="250" y="160" fill="#ffaa00" text-anchor="middle">Padding</text>`}},
flex:{params:[['Display','flex'],['Align','items-center'],['Justify','justify-center'],['Gap','gap-4']],i:"⇄",t:"Flexbox",b:"flex justify-center items-center gap-4 flex-col",draw(){return `<rect x="80" y="70" width="60" height="40" fill="#00ffff"/><rect x="180" y="70" width="60" height="40" fill="#00ffff"/><rect x="280" y="70" width="60" height="40" fill="#00ffff"/>`}},
grid:{params:[['Display','grid'],['Columns','grid-cols-3'],['Gap','gap-4'],['Rows','grid-rows-2']],i:"#",t:"Grid",b:"grid grid-cols-3 gap-4",draw(){let s='';for(let r=0;r<2;r++){for(let c=0;c<3;c++){s+=`<rect x="${80+c*90}" y="${40+r*60}" width="70" height="45" fill="none" stroke="#ff44cc"/>`;}}return s;}},
responsive:{params:[['sm','640px'],['md','768px'],['lg','1024px'],['xl','1280px']],i:"📱",t:"Responsive",b:"sm md lg xl 2xl breakpoints",draw(){return `<text x="50" y="90" fill="#4488ff">sm → md → lg → xl → 2xl</text>`}},
components:{params:[['Button','Reusable'],['Card','Composable'],['Form','Utility Based'],['Navbar','Responsive']],i:"🧩",t:"Components",b:"Buttons, cards, forms and navbars are combinations of utilities.",draw(){return `<rect x="170" y="60" width="160" height="50" rx="8" fill="none" stroke="#00ff88"/><text x="250" y="90" fill="#00ff88" text-anchor="middle">Button Component</text>`}}
};
const cards=document.getElementById("cards");
Object.keys(data).forEach(k=>{
const d=data[k];
cards.innerHTML+=`<div class="card" onclick="show('${k}')"><div class="icon">${d.i}</div><div>${d.t}</div></div>`;
});
function show(k){
heading.textContent=data[k].t;
body.textContent=data[k].b;
svg.innerHTML=data[k].draw();
let rows='';
data[k].params.forEach(p=>rows+=`<tr><td>${p[0]}</td><td>${p[1]}</td></tr>`);
document.getElementById('ptable').innerHTML=rows;
}
show('intro');
</script>
</body>
</html>
